name: OMP minor compatibility

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect newer OMP minor line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          baseline=$(node -p "require('./package.json').devDependencies['@oh-my-pi/pi-coding-agent']")
          latest=$(curl --fail --silent --show-error https://registry.npmjs.org/@oh-my-pi/pi-coding-agent/latest | jq -r .version)
          baseline_major=${baseline%%.*}
          baseline_minor=${baseline#*.}
          baseline_minor=${baseline_minor%%.*}
          latest_major=${latest%%.*}
          latest_minor=${latest#*.}
          latest_minor=${latest_minor%%.*}
          if [ "$latest_major" -ne "$baseline_major" ] || [ "$latest_minor" -le "$baseline_minor" ]; then
            exit 0
          fi
          title="Review OMP ${latest_major}.${latest_minor} compatibility"
          existing=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/issues?state=all&per_page=100" |
            jq --arg title "$title" 'any(.[]; (.pull_request | not) and .title == $title)')
          if [ "$existing" = true ]; then
            exit 0
          fi
          jq -n --arg title "$title" --arg body "The latest @oh-my-pi/pi-coding-agent release is $latest. Review compatibility before updating the synchronized OMP pins." \
            '{title: $title, body: $body}' |
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPOSITORY/issues" \
              --data-binary @-
