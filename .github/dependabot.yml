version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      omp-patch:
        patterns:
          - "@oh-my-pi/*"
        update-types:
          - version-update:semver-patch
    ignore:
      - dependency-name: "@oh-my-pi/*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
